[project]
name = "farm-records-agent"
version = "1.0.0"
description = "Farm Records Assistant: Streamlit + LangChain + Google Gemini (Get Skills Network, Python with AI, Level 1)"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.50",
    "pandas>=2.0",
    "altair>=5.0",
    "langchain-core>=1.0",
    "langchain-google-genai>=3.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
